<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; connect-src https:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBike Route Safety Map - UiTM Shah Alam</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root {
  --ink: #1d1a26; --paper: #f7f6fa; --line: #dcd8e6; --muted: #6b6779;
  --brand: #4b2e83; --red: #d92d20; --orange: #f79009; --green: #2e9e5b; --blue: #1d6fd8; --amber: #f5b800;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); display: grid; grid-template-columns: 320px 1fr; }
aside { background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
aside header { background: var(--brand); color: #fff; padding: 16px 18px; }
aside h1 { font-size: 17px; margin: 0 0 2px; font-weight: 650; }
aside header p { margin: 0; font-size: 12.5px; opacity: .85; }
.sec { padding: 12px 18px; border-bottom: 1px solid var(--line); }
.sec h2 { font-size: 13px; margin: 0 0 8px; }
#toggles label { display: flex; align-items: center; gap: 10px; padding: 4px 0; cursor: pointer; }
#list-wrap { overflow-y: auto; flex: 1; padding: 12px 18px; }
#list { list-style: none; margin: 0; padding: 0; }
#list button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 8px 6px; border-radius: 6px; cursor: pointer; }
#list button:hover, #list button:focus-visible { background: #ebe7f4; }
#list button:focus-visible { outline: 2px solid var(--brand); }
#list small { display: block; color: var(--muted); font-size: 12px; }
#list b { color: var(--muted); font-weight: 600; }
#map { height: 100%; }

/* pins */
.pin { width: 30px; height: 30px; display: grid; place-items: center; font-weight: 700; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.pin.sm { width: 22px; height: 22px; font-size: 12px; box-shadow: none; }
.pin.parking { background: var(--blue); border-radius: 50%; }
.pin.charging { background: var(--amber); border-radius: 50%; color: #3a2b00; }
.pin.safe { background: var(--green); border-radius: 50%; }
.pin.noentry { background: var(--red); border-radius: 50%; }
.pin.noentry i { display: block; width: 58%; height: 4px; background: #fff; border-radius: 2px; }
.pin.caution { background: var(--orange); border: none; clip-path: polygon(50% 4%, 98% 94%, 2% 94%); box-shadow: none; padding-top: 7px; color: #2b1800; }
.pin.roads { background: linear-gradient(90deg, #d92d20 50%, #f79009 50%); border-radius: 4px; }
.pin.sm.caution { padding-top: 5px; }

.badge { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 10px; white-space: nowrap; color: #fff; }
.badge.red { background: var(--red); } .badge.orange { background: var(--orange); color: #2b1800; }
.badge.yellow { background: #f2d600; color: #2b2500; } .badge.green { background: var(--green); }

/* hover video + popup */
.vtip { padding: 0; border: 0; border-radius: 8px; overflow: hidden; }
.vtip::before { display: none; }
.tip { width: 260px; background: #fff; }
.tip strong { display: block; padding: 8px 10px; font-size: 13px; color: var(--red); }
.tip video, .tip .novid { width: 100%; height: 146px; object-fit: cover; background: #111; display: block; }
.tip small { display: block; padding: 6px 10px; color: var(--muted); }
.novid { display: grid; place-items: center; color: #c9c5d6; background: #23202e; font-size: 13px; }
.pop img { width: 100%; border-radius: 6px; margin-bottom: 6px; }

/* enlarged view */
#modal { position: fixed; inset: 0; background: rgba(20,16,30,.72); display: grid; place-items: center; z-index: 2000; padding: 20px; }
#modal[hidden] { display: none; }
.sheet { background: #fff; width: min(820px, 100%); max-height: 100%; overflow-y: auto; border-radius: 12px; padding: 22px 26px 26px; position: relative; }
.close { position: absolute; top: 12px; right: 14px; font-size: 24px; line-height: 1; border: 0; background: none; cursor: pointer; padding: 4px 10px; border-radius: 6px; }
.close:hover, .close:focus-visible { background: #ebe7f4; outline: none; }
.sheet h2 { margin: 0 40px 2px 0; font-size: 20px; color: var(--red); }
.sheet h3 { font-size: 14px; margin: 18px 0 6px; }
.sheet .sub { margin: 0 0 12px; color: var(--muted); }
.sheet video, .sheet .novid { width: 100%; height: 380px; border-radius: 8px; background: #111; object-fit: contain; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 0; }
.stats div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stats dt { font-size: 12px; color: var(--muted); } .stats dd { margin: 2px 0 0; font-size: 18px; font-weight: 650; }
.muted { color: var(--muted); font-weight: 400; font-size: 13px; }
.sheet svg { width: 100%; height: auto; display: block; }
.sheet svg .fill { fill: rgba(217,45,32,.15); } .sheet svg .line { fill: none; stroke: var(--red); stroke-width: 2.5; }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

@media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 40% 60%; } .stats { grid-template-columns: 1fr; } .sheet video, .sheet .novid { height: 230px; } }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Interactive e-Bike Route Safety Map</h1>
    <p>UiTM Shah Alam</p>
  </header>
  <div class="sec"><h2>Show on map</h2><div id="toggles"></div></div>
  <div id="list-wrap"><h2 style="font-size:13px;margin:0 0 6px">Risky places</h2><ul id="list"></ul></div>
</aside>
<div id="map"></div>

<div id="modal" hidden role="dialog" aria-modal="true">
  <div class="sheet"><button class="close" aria-label="Close">&times;</button><div id="modal-body"></div></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
